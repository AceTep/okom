# Gaze engine settings. Every value here has a matching field in gaze/config.py.

camera:
  device: 0         # /dev/video0 on Linux; /dev/video1 on the demo laptop is a metadata node
  width: 1280
  height: 720
  fps: 30           # requested; the camera may deliver less in dim light
  fourcc: MJPG      # MJPG allows 720p at full rate over USB; empty string = driver default
  fixed_framerate: true  # Linux: stop the camera from slowing to ~15 fps in dim light
                         # (image gets slightly darker); restored on exit

landmarks:
  model_path: models/face_landmarker.task  # relative to the repo root
  num_faces: 2                    # > 1 so that a second person in frame is noticed
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

features:
  blink_threshold: 0.5            # eyeBlink blendshape at or above this = blinking

calibration:
  grid_cols: 5        # points per screen: grid_cols x grid_rows
  grid_rows: 3
  margin: 0.08        # outer points' distance from the screen edge, fraction of the screen
  countdown_s: 3.0    # before each screen
  settle_s: 0.4       # after the dot moves; eyes need time to get there, not recorded
  record_s: 0.6       # recorded per point
